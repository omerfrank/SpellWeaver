<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Campaign - Quest Weaver</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/styles.css">
    <link rel="stylesheet" href="/static/css/campaignSelect.css">
    <link rel="icon" type="image/webp" href="/static/icons/Quest_Weaver_Icon.webp">
</head>
<body>
    <!-- Top Navigation -->
    <nav class="top-navbar">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center">
                <div class="d-flex align-items-center">
                    <img src="/static/icons/Quest_Weaver_Icon.webp" class="navbar-logo" alt="Quest Weaver Logo">
                    <strong>Quest Weaver - DM</strong>
                </div>
                <div>
                    <button class="btn btn-logout btn-sm" onclick="logout()">
                        <i class="fas fa-sign-out-alt me-1"></i> Logout
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Page Header -->
    <div class="page-header">
        <div class="container">
            <h1><i class="fas fa-dungeon me-3"></i>Select Your Campaign</h1>
            <p class="text-muted">Choose a campaign to start your session</p>
        </div>
    </div>

    <!-- Loading State -->
    <div id="loadingContainer" class="loading-container" style="display: none;">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
        <p class="mt-3 text-muted">Loading campaigns...</p>
    </div>

    <!-- Campaigns Container -->
    <div id="campaignsContainer" class="container py-4">
        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4 justify-content-center" id="campaignGrid">
            <!-- Campaigns will be loaded here dynamically -->
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/campaignSelect.js">
    </script>
</body>
</html>
