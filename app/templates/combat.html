<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combat Menu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/static/css/styles.css">
    <link rel="stylesheet" href="/static/css/combat.css">
    <link rel="icon" type="image/webp" href="/static/icons/Quest_Weaver_Icon.webp">
</head>
<body>
    <button class="btn btn-secondary bi bi-list sticky-sidebar-button" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarOffcanvas" aria-controls="sidebarOffcanvas">
    </button>

    <div class="offcanvas offcanvas-end" tabindex="-1" id="sidebarOffcanvas" aria-labelledby="sidebarOffcanvasLabel" dir="rtl">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title" id="sidebarOffcanvasLabel">הגדרות</h5>
            <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body">
            <a href="{{ url_for('main.home') }}" class="sidebar-item">חזרה לעמוד הבית</a>
            <a href="{{ url_for('player.load_character_select') }}" class="sidebar-item">חזרה לבחירת דמויות</a>
        </div>
    </div>

    <div class="container mt-4" dir="ltr">
        <h1 class="text-center mb-4">Combat Menu</h1>

        <div class="section-card">
            <div class="section-title">
                <i class="bi bi-lightning-fill"></i> Generic Actions
            </div>
            <button class="btn btn-use w-100" data-bs-toggle="modal" data-bs-target="#genericActionsModal">
                <i class="bi bi-card-list"></i> View All Generic Actions
            </button>
        </div>

        <div class="section-card" dir="ltr">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <div class="section-title mb-0">
                    <i class="bi bi-star-fill"></i> Class Abilities
                </div>
                <div class="d-flex gap-2">
                    <button class="btn btn-secondary mobile-icon-only" onclick="resetAbilityUses('class')">
                        <i class="bi bi-arrow-clockwise"></i><span class="btn-text"> Reset Uses</span>
                    </button>
                    <button class="btn btn-add mobile-icon-only" data-bs-toggle="modal" data-bs-target="#addAbilityModal" onclick="setAbilityType('class')">
                        <i class="bi bi-plus-circle"></i><span class="btn-text"> Add Ability</span>
                    </button>
                </div>
            </div>
            <div id="classAbilitiesContainer"></div>
        </div>

        <div class="section-card" dir="ltr">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <div class="section-title mb-0">
                    <i class="bi bi-people-fill"></i> Racial Abilities
                </div>
                <div class="d-flex gap-2">
                    <button class="btn btn-secondary mobile-icon-only" onclick="resetAbilityUses('racial')">
                        <i class="bi bi-arrow-clockwise"></i><span class="btn-text"> Reset Uses</span>
                    </button>
                    <button class="btn btn-add mobile-icon-only" data-bs-toggle="modal" data-bs-target="#addAbilityModal" onclick="setAbilityType('racial')">
                        <i class="bi bi-plus-circle"></i><span class="btn-text"> Add Ability</span>
                    </button>
                </div>
            </div>
            <div id="racialAbilitiesContainer"></div>
        </div>
    </div>

    <div class="modal fade" id="genericActionsModal" tabindex="-1" aria-labelledby="genericActionsModalLabel" aria-hidden="true" dir="ltr">
        <div class="modal-dialog modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="genericActionsModalLabel">Generic Actions</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="genericActionsContainer"></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="addAbilityModal" tabindex="-1" aria-labelledby="addAbilityModalLabel" aria-hidden="true" dir="ltr">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="addAbilityModalLabel">Add New Ability</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="addAbilityForm">
                        <div class="mb-3">
                            <label class="form-label">Ability Type</label>
                            <select class="form-control" id="abilityTypeSelect" onchange="toggleActiveFields()">
                                <option value="passive">Passive</option>
                                <option value="active">Active</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Name</label>
                            <input type="text" class="form-control" id="abilityName" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Summary (Short description for card)</label>
                            <input type="text" class="form-control" id="abilitySummary" placeholder="Brief description shown on ability card" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Full Description</label>
                            <textarea class="form-control" id="abilityFullDescription" rows="3" placeholder="Detailed description shown in popup" required></textarea>
                        </div>
                        <div id="activeFields" style="display: none;">
                            <div class="mb-3">
                                <label class="form-label">Range</label>
                                <input type="text" class="form-control" id="abilityRange" placeholder="e.g., 30 feet, Self, Touch">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Action Requirement</label>
                                <select class="form-control" id="abilityAction">
                                    <option value="Action">Action</option>
                                    <option value="Bonus Action">Bonus Action</option>
                                    <option value="Reaction">Reaction</option>
                                    <option value="Free Action">Free Action</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Max Uses</label>
                                <input type="number" class="form-control" id="abilityMaxUses" min="1" value="1">
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-add" onclick="addAbility()">Add Ability</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="abilityDetailsModal" tabindex="-1" aria-labelledby="abilityDetailsModalLabel" aria-hidden="true" dir="ltr">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="abilityDetailsModalLabel">Ability Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="abilityDetailsBody"></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-add" id="editAbilityBtn">
                        <i class="bi bi-pencil"></i> Edit
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Desktop navbar -->
    <nav class="footer-navbar d-none d-md-block" dir="ltr">
        <div class="container d-flex justify-content-center">
            <a href="{{ url_for('player.load_showcase') }}">Showcase</a>
            <a href="{{ url_for('player.load_character') }}">Character</a>
            <a href="{{ url_for('player.load_inventory') }}">Inventory</a>
            <a href="{{ url_for('player.load_combat') }}"class="active-link">Combat Menu</a>
            <a href="{{ url_for('player.load_spells') }}">Spells</a>
            <a href="{{ url_for('player.load_background') }}" >Background & Notes</a>
        </div>
    </nav>

    <!-- Phone navbar -->
    <nav class="footer-navbar d-md-none" dir="ltr">
        <div class="container-fluid">
            <div class="row row-cols-6 g-2 text-center">
                <div class="col">
                    <a href="{{ url_for('player.load_showcase') }}" class="nav-link">
                        <i class="bi bi-person-square"></i>
                    </a>
                </div>
                <div class="col">
                    <a href="{{ url_for('player.load_character') }}" class="nav-link">
                        <i class="bi bi-person-lines-fill"></i>
                    </a>
                </div>
                <div class="col">
                    <a href="{{ url_for('player.load_inventory') }}" class="nav-link">
                        <i class="bi bi-backpack2"></i>
                    </a>
                </div>
                <div class="col">
                    <a href="{{ url_for('player.load_combat') }}" class="nav-link active-link">
                        <i class="bi bi-shield-shaded"></i>
                    </a>
                </div>
                <div class="col">
                    <a href="{{ url_for('player.load_spells') }}" class="nav-link">
                        <i class="bi bi-fire"></i>
                    </a>
                </div>
                <div class="col">
                    <a href="{{ url_for('player.load_background') }}" class="nav-link ">
                        <i class="bi bi-journal-bookmark-fill"></i>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/combat.js"></script>
    
</body>
</html>
