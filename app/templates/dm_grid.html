<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battle Grid - Quest Weaver</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/styles.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #2c2f33;
            overflow: hidden;
        }
        
        .grid-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .grid-toolbar {
            background-color: #23272a;
            border-bottom: 2px solid #4f545c;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .grid-canvas {
            flex: 1;
            background-color: #2c2f33;
            background-image: 
                linear-gradient(#4f545c 1px, transparent 1px),
                linear-gradient(90deg, #4f545c 1px, transparent 1px);
            background-size: 50px 50px;
            position: relative;
            overflow: auto;
        }
        
        .session-info {
            color: #ffffff;
            font-size: 0.9rem;
        }
        
        .grid-controls button {
            margin-left: 10px;
            background-color: #c94b4b;
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
        }
        
        .grid-controls button:hover {
            background-color: #a83e3e;
        }
        
        .map-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .map-overlay img {
            max-width: 90%;
            max-height: 90%;
            opacity: 0.8;
        }
        
        .loading-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ffffff;
            text-align: center;
        }
        
        .spinner-border {
            width: 3rem;
            height: 3rem;
            border-width: 0.3rem;
        }
    </style>
</head>
<body>
    <div class="grid-container">
        <!-- Toolbar -->
        <div class="grid-toolbar">
            <div class="session-info">
                <strong>Battle Grid</strong>
                <span class="ms-3 text-muted">Session: <span id="sessionIdDisplay">{{ session_id }}</span></span>
            </div>
            <div class="grid-controls">
                <button onclick="toggleGrid()">
                    <i class="fas fa-border-all me-2"></i>Toggle Grid
                </button>
                <button onclick="clearMap()">
                    <i class="fas fa-eraser me-2"></i>Clear Map
                </button>
                <button onclick="refreshGrid()">
                    <i class="fas fa-sync me-2"></i>Refresh
                </button>
            </div>
        </div>
        
        <!-- Grid Canvas -->
        <div class="grid-canvas" id="gridCanvas">
            <div class="loading-message" id="loadingMessage">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p class="mt-3">Connecting to session...</p>
            </div>
            
            <!-- Map overlay (will be populated via JS) -->
            <div class="map-overlay" id="mapOverlay"></div>
        </div>
    </div>

    <script>
        // Store session ID from template
        const SESSION_ID = "{{ session_id }}";
        let gridVisible = true;
        let currentMapUrl = null;
        
        // Initialize grid
        document.addEventListener('DOMContentLoaded', function() {
            console.log('Grid view loaded for session:', SESSION_ID);
            
            // Simulate loading completion
            setTimeout(() => {
                document.getElementById('loadingMessage').style.display = 'none';
            }, 1000);
            
            // TODO: Set up real-time listeners for map updates from Firebase
            // This would listen to game_state/current_map and update accordingly
            
            // For now, just log that we're ready
            console.log('Grid ready. Waiting for map updates...');
        });
        
        function toggleGrid() {
            gridVisible = !gridVisible;
            const canvas = document.getElementById('gridCanvas');
            
            if (gridVisible) {
                canvas.style.backgroundImage = 
                    'linear-gradient(#4f545c 1px, transparent 1px), linear-gradient(90deg, #4f545c 1px, transparent 1px)';
            } else {
                canvas.style.backgroundImage = 'none';
            }
        }
        
        function clearMap() {
            if (confirm('Clear the current map?')) {
                document.getElementById('mapOverlay').innerHTML = '';
                currentMapUrl = null;
                console.log('Map cleared');
            }
        }
        
        function refreshGrid() {
            console.log('Refreshing grid data...');
            // TODO: Fetch latest game state from Firebase
            window.location.reload();
        }
        
        // Function to update map when DM pushes a new one
        function updateMap(mapUrl) {
            currentMapUrl = mapUrl;
            const overlay = document.getElementById('mapOverlay');
            
            if (mapUrl) {
                overlay.innerHTML = `<img src="${mapUrl}" alt="Battle map">`;
            } else {
                overlay.innerHTML = '';
            }
        }
        
        // TODO: Set up Firebase listener for real-time map updates
        // This would connect to Firebase and listen for changes to
        // sessions/{SESSION_ID}/gameState/current_map
        
        console.log('Grid controls initialized');
    </script>
</body>
</html>
