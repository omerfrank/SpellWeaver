<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battle Grid - Quest Weaver</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            overflow: hidden;
            background-color: #000;
            font-family: Arial, sans-serif;
        }
        
        #gridContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        
        /* All layers must be identical in position and size */
        .layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        
        /* Layer 0: Background Image */
        #layer0 {
            z-index: 1;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #1a1a1a;
        }
        
        /* Layer 1: Static Grid */
        #layer1 {
            z-index: 2;
            pointer-events: none; /* Allow clicks to pass through */
        }
        
        /* Layer 2: Effects and Overlays */
        #layer2 {
            z-index: 3;
            cursor: crosshair;
        }
        
        /* HUD Overlay - doesn't interfere with layers */
        #hud {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 10px 15px;
            border-radius: 5px;
            font-size: 12px;
            pointer-events: none;
            font-family: 'Courier New', monospace;
        }
        
        #hud .status {
            margin: 3px 0;
        }
        
        #hud .connected {
            color: #57f287;
        }
        
        #hud .error {
            color: #ed4245;
        }
        
        /* Keybind Help */
        #keybindHelp {
            position: fixed;
            bottom: 10px;
            right: 10px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            padding: 15px;
            border-radius: 5px;
            font-size: 11px;
            max-width: 250px;
            transition: opacity 0.3s;
        }
        

        
        #keybindHelp h4 {
            margin: 0 0 10px 0;
            font-size: 13px;
            color: #c94b4b;
        }
        
        #keybindHelp .keybind {
            margin: 5px 0;
        }
        
        #keybindHelp kbd {
            background: #4f545c;
            padding: 2px 6px;
            border-radius: 3px;
            font-weight: bold;
            margin-right: 5px;
        }
    </style>
</head>
<body>
    <div id="gridContainer">
        <!-- Layer 0: Background Image -->
        <div id="layer0" class="layer"></div>
        
        <!-- Layer 1: Static Grid (Canvas) -->
        <canvas id="layer1" class="layer"></canvas>
        
        <!-- Layer 2: Effects & Overlays (Canvas) -->
        <canvas id="layer2" class="layer"></canvas>
    </div>
    
    <!-- HUD Display -->
    <div id="hud">
        <div class="status">Session: <span id="sessionId">Loading...</span></div>
        <div class="status">Grid: <span id="gridStatus">10x8</span></div>
        <div class="status">Connection: <span id="connectionStatus" class="connected">●</span></div>
        <div class="status">Cell: <span id="currentCell">-</span></div>
    </div>
    
    <!-- Keybind Help -->
    <div id="keybindHelp">
        <h4>Controls</h4>
        <div class="keybind"><kbd>Click</kbd> Toggle cell</div>
        <div class="keybind"><kbd>C</kbd> Clear effects</div>
        <div class="keybind"><kbd>H</kbd> Toggle background</div>
        <div class="keybind"><kbd>M</kbd> Range mode (hold)</div>
        <div class="keybind"><kbd>T</kbd> Ping cell</div>
        <div class="keybind"><kbd>?</kbd> Toggle help</div>
    </div>

<script>
        // ============================================
        // CONFIGURATION
        // ============================================
        const CONFIG = {
            GRID_ROWS: 8,
            GRID_COLS: 10,
            GRID_LINE_WIDTH: 4,
            GRID_COLOR: '#ffffff',
            POLL_INTERVAL: 2000,
            EFFECT_OPACITY: 0.6,
            HIGHLIGHT_COLOR: 'rgba(201, 75, 75, 0.6)',
            RANGE_COLOR: 'rgba(114, 137, 218, 0.5)',
            PING_COLOR: '#faa61a'
        };
        let cell; // Tracks current hover cell

        // ============================================
        // STATE MANAGEMENT
        // ============================================
        const STATE = {
            sessionId: null,
            currentMapUrl: null,
            backgroundVisible: true,
            rangeModeActive: false,
            selectedCells: new Set(),
            lastServerState: null,
            pollingActive: true,
            
            // Dragging State
            isDragging: false,
            dragStart: null,      // For Range Mode (Start Center)
            selectionMode: true   // For Normal Mode (true=Select, false=Deselect)
        };

        // ============================================
        // LAYER REFERENCES
        // ============================================
        const layer0 = document.getElementById('layer0');
        const layer1 = document.getElementById('layer1');
        const layer2 = document.getElementById('layer2');
        const ctx1 = layer1.getContext('2d');
        const ctx2 = layer2.getContext('2d');

        // ============================================
        // INITIALIZATION
        // ============================================
        function init() {
            const urlParams = new URLSearchParams(window.location.search);
            STATE.sessionId = urlParams.get('session') || extractSessionFromPath();
            
            if (!STATE.sessionId) {
                console.error('No session ID found in URL');
                updateConnectionStatus('error');
                return;
            }
            
            document.getElementById('sessionId').textContent = STATE.sessionId;
            
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            
            drawGrid();
            setupEventListeners();
            startPolling();
            
            console.log('Grid initialized for session:', STATE.sessionId);
        }

        function extractSessionFromPath() {
            const pathParts = window.location.pathname.split('/');
            const sessionIndex = pathParts.indexOf('session');
            if (sessionIndex !== -1 && pathParts[sessionIndex + 1]) {
                return pathParts[sessionIndex + 1];
            }
            return null;
        }

        function resizeCanvas() {
            const width = window.innerWidth;
            const height = window.innerHeight;
            
            layer1.width = width;
            layer1.height = height;
            layer2.width = width;
            layer2.height = height;
            
            drawGrid();
            redrawEffects();
        }

        // ============================================
        // LAYER 1: STATIC GRID
        // ============================================
        function drawGrid() {
            ctx1.clearRect(0, 0, layer1.width, layer1.height);
            
            const cellWidth = layer1.width / CONFIG.GRID_COLS;
            const cellHeight = layer1.height / CONFIG.GRID_ROWS;
            
            ctx1.strokeStyle = CONFIG.GRID_COLOR;
            ctx1.lineWidth = CONFIG.GRID_LINE_WIDTH;
            ctx1.lineCap = 'square';
            
            for (let col = 0; col <= CONFIG.GRID_COLS; col++) {
                const x = col * cellWidth;
                ctx1.beginPath();
                ctx1.moveTo(x, 0);
                ctx1.lineTo(x, layer1.height);
                ctx1.stroke();
            }
            
            for (let row = 0; row <= CONFIG.GRID_ROWS; row++) {
                const y = row * cellHeight;
                ctx1.beginPath();
                ctx1.moveTo(0, y);
                ctx1.lineTo(layer1.width, y);
                ctx1.stroke();
            }
        }

        // ============================================
        // LAYER 2: EFFECTS & OVERLAYS
        // ============================================
        function clearEffects() {
            ctx2.clearRect(0, 0, layer2.width, layer2.height);
            STATE.selectedCells.clear();
        }

        function redrawEffects() {
            ctx2.clearRect(0, 0, layer2.width, layer2.height);
            
            // Redraw Highlighted Cells
            STATE.selectedCells.forEach(cellKey => {
                const [row, col] = cellKey.split(',').map(Number);
                drawCellHighlight(row, col);
            });
        }

        function drawCellHighlight(row, col) {
            const cellWidth = layer2.width / CONFIG.GRID_COLS;
            const cellHeight = layer2.height / CONFIG.GRID_ROWS;
            
            const x = col * cellWidth;
            const y = row * cellHeight;
            
            ctx2.fillStyle = CONFIG.HIGHLIGHT_COLOR;
            ctx2.fillRect(x, y, cellWidth, cellHeight);
        }

        function drawRangeCircle(centerRow, centerCol, radiusCells) {
            const cellWidth = layer2.width / CONFIG.GRID_COLS;
            const cellHeight = layer2.height / CONFIG.GRID_ROWS;
            
            const centerX = (centerCol + 0.5) * cellWidth;
            const centerY = (centerRow + 0.5) * cellHeight;
            const radius = radiusCells * Math.min(cellWidth, cellHeight);
            
            ctx2.fillStyle = CONFIG.RANGE_COLOR;
            ctx2.beginPath();
            ctx2.arc(centerX, centerY, radius, 0, Math.PI * 2);
            ctx2.fill();
            
            ctx2.strokeStyle = "rgba(255, 255, 255, 0.4)";
            ctx2.lineWidth = 2;
            ctx2.stroke();
        }

        function pingCell(row, col) {
            const cellWidth = layer2.width / CONFIG.GRID_COLS;
            const cellHeight = layer2.height / CONFIG.GRID_ROWS;
            const centerX = (col + 0.5) * cellWidth;
            const centerY = (row + 0.5) * cellHeight;
            
            let scale = 0;
            const maxScale = 2;
            const duration = 1000;
            const startTime = Date.now();
            
            function animatePing() {
                const elapsed = Date.now() - startTime;
                const progress = elapsed / duration;
                
                if (progress >= 1) {
                    redrawEffects(); 
                    return;
                }
                
                redrawEffects();
                
                scale = progress * maxScale;
                const alpha = 1 - progress;
                const radius = scale * Math.min(cellWidth, cellHeight) * 0.5;
                
                ctx2.strokeStyle = `rgba(250, 166, 26, ${alpha})`;
                ctx2.lineWidth = 3;
                ctx2.beginPath();
                ctx2.arc(centerX, centerY, radius, 0, Math.PI * 2);
                ctx2.stroke();
                
                requestAnimationFrame(animatePing);
            }
            
            animatePing();
        }

        // ============================================
        // MOUSE INTERACTION LOGIC
        // ============================================
        function getCellFromMouse(event) {
            const rect = layer2.getBoundingClientRect();
            const x = event.clientX - rect.left;
            const y = event.clientY - rect.top;
            
            const cellWidth = layer2.width / CONFIG.GRID_COLS;
            const cellHeight = layer2.height / CONFIG.GRID_ROWS;
            
            const col = Math.floor(x / cellWidth);
            const row = Math.floor(y / cellHeight);
            
            if (row >= 0 && row < CONFIG.GRID_ROWS && col >= 0 && col < CONFIG.GRID_COLS) {
                return { row, col };
            }
            return null;
        }

        // Helper to toggle a specific cell on/off
        function updateCellSelection(row, col, shouldSelect) {
            const cellKey = `${row},${col}`;
            if (shouldSelect) {
                STATE.selectedCells.add(cellKey);
            } else {
                STATE.selectedCells.delete(cellKey);
            }
            redrawEffects();
        }

        function handleMouseDown(event) {
            const startCell = getCellFromMouse(event);
            if (!startCell) return;

            STATE.isDragging = true;

            if (STATE.rangeModeActive) {
                // --- RANGE MODE ---
                STATE.dragStart = startCell;
            } else {
                // --- NORMAL SELECT MODE (PAINT) ---
                const cellKey = `${startCell.row},${startCell.col}`;
                
                // Logic: If I click an active cell, I want to erase.
                // If I click an empty cell, I want to add.
                const isAlreadySelected = STATE.selectedCells.has(cellKey);
                STATE.selectionMode = !isAlreadySelected; // Set mode for this drag session
                
                // Apply immediately to the first cell
                updateCellSelection(startCell.row, startCell.col, STATE.selectionMode);
            }
        }

        function handleMouseUp(event) {
            STATE.isDragging = false;
            STATE.dragStart = null;
        }

        function handleMouseMove(event) {
            cell = getCellFromMouse(event);
            
            // Update HUD
            if (cell) {
                document.getElementById('currentCell').textContent = `[${cell.row}, ${cell.col}]`;
            } else {
                document.getElementById('currentCell').textContent = '-';
            }

            // Handle Dragging Logic
            if (STATE.isDragging && cell) {
                
                if (STATE.rangeModeActive && STATE.dragStart) {
                    // Range Mode: Draw Circle
                    const dx = cell.col - STATE.dragStart.col;
                    const dy = cell.row - STATE.dragStart.row;
                    const radius = Math.sqrt(dx * dx + dy * dy);
                    redrawEffects(); 
                    drawRangeCircle(STATE.dragStart.row, STATE.dragStart.col, radius);

                } else if (!STATE.rangeModeActive) {
                    // Normal Mode: Paint Selection
                    // Apply the mode (Select vs Deselect) determined in MouseDown
                    updateCellSelection(cell.row, cell.col, STATE.selectionMode);
                }
            }
        }

        // ============================================
        // EVENT LISTENERS
        // ============================================
        function setupEventListeners() {
            // Use MouseDown/Move/Up instead of Click for dragging support
            layer2.addEventListener('mousedown', handleMouseDown);
            layer2.addEventListener('mousemove', handleMouseMove);
            layer2.addEventListener('mouseup', handleMouseUp);
            // Safety: Stop dragging if mouse leaves window
            layer2.addEventListener('mouseleave', handleMouseUp);
            
            document.addEventListener('keydown', (e) => {
                if (e.repeat) return;

                switch(e.key.toLowerCase()) {
                    case 'c': clearEffects(); break;
                    case 'h': toggleBackground(); break;
                    case 'm': 
                        STATE.rangeModeActive = true;
                        layer2.style.cursor = 'crosshair';
                        break;
                    case 't': 
                        if (cell) pingCell(cell.row, cell.col);
                        break;
                    case '?': toggleHelp(); break;
                }
            });
            
            document.addEventListener('keyup', (e) => {
                if (e.key.toLowerCase() === 'm') {
                    STATE.rangeModeActive = false;
                    layer2.style.cursor = 'crosshair';
                    handleMouseUp(); // Cleanup drag if key released mid-drag
                }
            });
        }

        function toggleBackground() {
            STATE.backgroundVisible = !STATE.backgroundVisible;
            layer0.style.opacity = STATE.backgroundVisible ? '1' : '0';
        }

        function toggleHelp() {
            const help = document.getElementById('keybindHelp');
            const hud = document.getElementById('hud');
            help.style.display = help.style.display === 'block' ? 'none' : 'block';
            hud.style.display = hud.style.display === 'block' ? 'none' : 'block';
        }

        // ============================================
        // SERVER POLLING
        // ============================================
        function startPolling() {
            fetchGameState();
            setInterval(() => {
                if (STATE.pollingActive) fetchGameState();
            }, CONFIG.POLL_INTERVAL);
        }

        async function fetchGameState() {
            try {
                const response = await fetch(`/api/grid/session/${STATE.sessionId}/gridState`);
                if (!response.ok) throw new Error('Failed to fetch game state');
                
                const data = await response.json();
                
                if (data.status === 'success') {
                    updateGameState(data.gameState);
                    updateConnectionStatus('connected');
                }
            } catch (error) {
                console.error('Polling error:', error);
                updateConnectionStatus('error');
            }
        }

        function updateGameState(newState) {
            // Handle map image update
            const newUrlString = newState.mapUrl?.url || newState.mapUrl;
            if (newUrlString && newUrlString !== STATE.currentMapUrl) {
                updateBackgroundImage(newUrlString);
            }
            STATE.lastServerState = newState;
        }

        function updateBackgroundImage(url) {
            STATE.currentMapUrl = url;
            layer0.style.backgroundImage = `url('${url}')`;
        }

        function updateConnectionStatus(status) {
            const statusEl = document.getElementById('connectionStatus');
            statusEl.className = (status === 'connected') ? 'connected' : 'error';
        }

        // ============================================
        // START APPLICATION
        // ============================================
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
