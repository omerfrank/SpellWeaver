<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battle Grid - Quest Weaver</title>
    <link rel="stylesheet" href="/static/css/dm_grid.css">
</head>
<body>
    <div id="gridContainer">
        <div id="layer0" class="layer"></div>
        <canvas id="layer1" class="layer"></canvas>
        <canvas id="layer2" class="layer"></canvas>
    </div>
    
    <div id="hud">
        <div class="status">Session: <span id="sessionId">Loading...</span></div>
        <div class="status">Grid: <span id="gridStatus">10x8</span></div>
        <div class="status">Connection: <span id="connectionStatus" class="connected">●</span></div>
        <div class="status">Cell: <span id="currentCell">-</span></div>
    </div>
    
    <div id="keybindHelp">
        <h4>Controls</h4>
        <div class="keybind"><kbd>Click+Drag</kbd> Paint/Select</div>
        <div class="keybind"><kbd>F</kbd> Toggle Fog Mode</div>
        <div class="keybind"><kbd>C</kbd> Clear All</div>
        <div class="keybind"><kbd>H</kbd> Toggle Background</div>
        <div class="keybind"><kbd>M</kbd> Measure (Hold)</div>
        <div class="keybind"><kbd>T</kbd> Ping Location</div>
    </div>
    <script src="/static/js/dm_grid.js" defer></script>
</body>
</html>
